name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  # Valores de teste (sem segredo real). Segredos de homolog/prod ficam no secret manager.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/licenciagov?schema=public
  APP_URL: http://localhost:3000
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  DATA_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
  HASH_PEPPER: ci-only-pepper
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: ./storage

jobs:
  check:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # o build pode pré-renderizar páginas que consultam o banco
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: licenciagov
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: licenciagov
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Migrações + seed demo (+ cliente Riachão das Neves para o T12 – isolamento)
        run: |
          npx prisma migrate deploy
          npm run seed:demo
          npm run onboard -- riachao-das-neves --demo
          npm run seed:riachao-demo
      - name: Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Iniciar servidor (standalone)
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/
          # Chromium do Playwright também serve para os PDFs (puppeteer-core)
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server.log 2>&1 &
          npx --yes wait-on -t 120000 http-get://127.0.0.1:3000/api/health
      - name: Testes E2E
        run: npm run test:e2e
      - name: Log do servidor
        if: failure()
        run: tail -n 200 server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Opcional (manual: Actions → CI → Run workflow): suíte E2E contra o conjunto da PoC (CDS Piemonte do Paraguaçu –
  # docs/poc-cds.md). Base própria, SEM a demonstração fictícia: onboarding cds-piemonte --demo + seed:cds-poc.
  e2e-poc-cds:
    name: E2E (Playwright) – dataset PoC CDS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: licenciagov
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_DATASET: poc-cds
      DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Migrações + onboarding CDS Piemonte + dados de ensaio da PoC
        run: |
          npx prisma migrate deploy
          npm run onboard -- cds-piemonte --demo
          npm run seed:cds-poc
      - name: Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Iniciar servidor (standalone)
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server.log 2>&1 &
          npx --yes wait-on -t 120000 http-get://127.0.0.1:3000/api/health
      - name: Testes E2E (E2E_DATASET=poc-cds)
        run: npm run test:e2e:poc-cds
      - name: Log do servidor
        if: failure()
        run: tail -n 200 server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-poc-cds
          path: |
            playwright-report
            test-results
          retention-days: 14

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          tags: licenciagov:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: licenciagov-worker:ci
          cache-from: type=gha
